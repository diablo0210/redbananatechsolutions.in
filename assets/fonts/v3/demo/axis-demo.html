<!doctype html> <html><head><meta charset="utf-8"> <link rel="stylesheet" href="../../../css/v3-type.css"> <style>body{background:#080808;color:#e1e5e5;margin:0;padding:8vw}#cls-probe{max-width:40rem}.sub{font-family:var(--font-text);font-size:1.125rem;color:#b7bcbc;margin-top:1rem}</style></head> <body> <div id="cls-probe"> <p class="eyebrow" style="font-family:var(--font-text);color:#8a8f8f">Museum technology, engineered in India</p> <h1 id="axis-h1" class="h1">Technology you don't just see.<br><em>You experience.</em></h1> <p class="sub">Interactive museums, intelligent installations and AI experiences.</p> </div> <script>
  // 10-line demo: tween font-variation-settings (wght/wdth/opsz) on the H1.
  const el = document.getElementById('axis-h1');
  const t0 = performance.now();
  function tick(now) {
    const t = ((now - t0) / 1800) % 1;
    const wave = (Math.sin(t * Math.PI * 2) + 1) / 2; // 0..1
    const wght = Math.round(500 + wave * 300);          // 500 -> 800
    const wdth = Math.round(90 + wave * 10);             // 90 -> 100
    const opsz = Math.round(60 + wave * 36);             // 60 -> 96
    el.style.fontVariationSettings = `"wght" ${wght}, "wdth" ${wdth}, "opsz" ${opsz}`;
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script> </body></html>
